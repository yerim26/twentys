<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 움직임 시안 — Twentys</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">TWENTYS · MOTION PREVIEW</p><h1>캐릭터 움직임 시안</h1><p>기존 게임에 적용하지 않은 별도 검토 화면입니다. 원본 SVG의 모양과 색을 유지했습니다.</p><div class="controls"><label>동작 <select id="mode"><option value="active">활발한 동작</option><option value="both">부드러운 기본</option><option value="nod">끄덕임 / 가벼운 인사</option><option value="sway">몸 흔들림</option></select></label><label class="strength">강도 <input id="strength" type="range" min="40" max="140" step="10" value="100"><output id="strength-value">100%</output></label><button id="play">일시 정지</button><button id="reset">처음부터</button></div></header><section class="cards" aria-label="캐릭터 시안"><article data-room="workki"><h2>왈끼</h2><div class="art"></div><p>머리를 확실하게 끄덕이며 몸으로 박자를 탑니다.</p></article><article data-room="zibi"><h2>지비지기</h2><div class="art"></div><p>좌우로 기울이며 몸을 가볍게 튕깁니다.</p></article><article data-room="eddie"><h2>에디</h2><div class="art"></div><p>두 번 통통 뛰고 반갑게 인사합니다.</p></article></section><p id="status" role="status">원본 캐릭터를 불러오는 중…</p><p class="note">기기의 ‘동작 줄이기’ 설정을 켜면 정지 화면으로 표시합니다.</p></main><script type="module" src="preview.js"></script></body></html>
