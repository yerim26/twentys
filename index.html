<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My First Home</title><style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;overflow:hidden}body{background:white}</style></head><body><iframe id="stage" title="My First Home"></iframe><script type="module">
import { installHeldPieceAppearance } from './shared/held-piece.js';
import { installStageNavigation } from './shared/stage-navigation.js';
import { installInactivityReset } from './round2/shared/inactivity.js';
const frame = document.querySelector('#stage');
let cleanupLegacyInactivity = () => {};
frame.addEventListener('load', () => {
  cleanupLegacyInactivity();
  cleanupLegacyInactivity = () => {};
  if (frame.dataset.stage === 'round2') return;
  cleanupLegacyInactivity = installInactivityReset({targetWindow: frame.contentWindow, onTimeout: () => {
    const home = new URL(location.href);
    home.search = '';
    home.hash = '';
    location.assign(home.href);
  }});
  installHeldPieceAppearance(frame.contentDocument);
  if (frame.dataset.stage === '1') installStageNavigation(frame.contentDocument, () => {
    const url = new URL(location.href);
    url.searchParams.set('stage', '2');
    history.pushState(null, '', url);
    showStage();
  });
});
function showStage() {
  const params = new URL(location.href).searchParams;
  const requestedRound = params.get('round');
  const legacyStage = !requestedRound && ['1', '2'].includes(params.get('stage'));
  if (!legacyStage) {
    const round = ['2', '3'].includes(requestedRound) ? requestedRound : '1';
    const requestedRoom = params.get('room');
    const room = ['workki', 'zibi', 'eddie'].includes(requestedRoom) ? requestedRoom : 'workki';
    const target = new URL('round2/index.html', location.href);
    target.searchParams.set('round', round);
    if (round !== '1') target.searchParams.set('room', room);
    frame.dataset.stage = 'round2';
    frame.contentWindow.location.replace(target);
    document.title = round === '1' ? 'Round 1 탐색 — Twentys' : `${{ workki: '왈끼', zibi: '지비지기', eddie: '에디' }[room]} · Round ${round} — Twentys`;
    return;
  }
  const requested = new URL(location.href).searchParams.get('stage');
  const stage = requested === '1' ? 1 : 2;
  // The host owns the round history; iframe loads must not add a second entry.
  frame.contentWindow.location.replace(new URL(`stages/stage${stage}/index.html`, location.href));
  frame.dataset.stage = stage;
  document.title = `${stage === 1 ? '독립' : '경험과 성장'} — My First Home`;
}
window.addEventListener('popstate', showStage);
showStage();
</script></body></html>
